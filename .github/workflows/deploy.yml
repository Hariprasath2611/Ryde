name: CI/CD Pipeline - Staging & Production Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------
  # Job 1: Verification (Lint, Typecheck, Unit Tests)
  # ----------------------------------------------------
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared workspace
        run: npm run build -w shared

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit & integration test suites
        run: npm test

  # ----------------------------------------------------
  # Job 2: Staging Deployment (Automatic on push to main)
  # ----------------------------------------------------
  deploy-staging:
    name: Apply Migrations & Deploy to Staging
    needs: [verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Staging Project & Apply Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
          SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_STAGING_PROJECT_ID" ]; then
            supabase link --project-ref "$SUPABASE_STAGING_PROJECT_ID" --password "$SUPABASE_STAGING_DB_PASSWORD"
            supabase db push
          else
            echo "Skipping Supabase staging db push (secrets not configured in fork)"
          fi

      - name: Trigger Render Staging Deployment
        env:
          RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_STAGING_DEPLOY_HOOK" ]; then
            curl -f -X POST "$RENDER_STAGING_DEPLOY_HOOK"
          else
            echo "Skipping Render deploy hook (secret not configured)"
          fi

      - name: Verify Staging Readiness Probe
        run: |
          echo "Waiting for staging health probe to report healthy..."
          # curl -f https://staging-api.ryde.capital/api/v1/health/readiness || true

  # ----------------------------------------------------
  # Job 3: Production Deployment (Manual Approval Gate)
  # ----------------------------------------------------
  deploy-production:
    name: Production Release (Manual Gate)
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # Configured in GitHub repo settings with required reviewer approval

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Production Project & Apply Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_PROJECT_ID: ${{ secrets.SUPABASE_PROD_PROJECT_ID }}
          SUPABASE_PROD_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_PROD_PROJECT_ID" ]; then
            supabase link --project-ref "$SUPABASE_PROD_PROJECT_ID" --password "$SUPABASE_PROD_DB_PASSWORD"
            supabase db push
          else
            echo "Skipping Supabase production db push (secrets not configured)"
          fi

      - name: Trigger Render Production Deployment
        env:
          RENDER_PROD_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_PROD_DEPLOY_HOOK" ]; then
            curl -f -X POST "$RENDER_PROD_DEPLOY_HOOK"
          else
            echo "Skipping Render production deploy hook (secret not configured)"
          fi

      - name: Verify Production Readiness Probe
        run: |
          echo "Verifying production health check..."
          # curl -f https://api.ryde.capital/api/v1/health/readiness || true
