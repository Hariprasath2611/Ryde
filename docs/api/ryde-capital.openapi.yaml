openapi: 3.0.3
info:
  title: Ryde Capital API (Driver App Backend)
  version: 0.1.0
  description: >
    REST API specification for Ryde Capital, the driver-facing application of the Ryde Platform.
    Ryde allows vehicle owners in India to book professional drivers for their personal vehicles.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
  - url: https://capital-api.ryde.in/api/v1
    description: Production gateway

security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service operational status, uptime, and current API version.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      x-status: implemented
      summary: Retrieve authenticated driver profile identity
      description: Validates Supabase JWT and returns authenticated user profile plus driver record.
      responses:
        '200':
          description: Successfully authenticated driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/complete-signup:
    post:
      x-status: implemented
      summary: Complete driver profile signup after phone OTP verification
      description: >
        Requires valid Supabase JWT. Upserts profiles (role=driver), creates drivers record,
        sets app_metadata.role=driver, and writes an audit log. The driver role is server-enforced
        and any client-supplied role is strictly ignored. Idempotent across multiple invocations.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSignupRequest'
      responses:
        '200':
          description: Signup completed successfully or existing driver returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteSignupResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Too many requests

  /drivers/me:
    get:
      x-status: implemented
      summary: Get driver personal details, profile & onboarding checklist
      description: Returns the driver profile, verification status, allowed vehicle types, and full 5-step onboarding checklist.
      responses:
        '200':
          description: Driver profile details and onboarding checklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileAndChecklist'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      x-status: implemented
      summary: Update driver personal details and vehicle capabilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileAndChecklist'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /drivers/me/documents/upload-url:
    post:
      x-status: implemented
      summary: Request short-lived signed upload URL for document storage
      description: Returns a short-lived (15 min) signed upload URL to directly upload private KYC documents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, contentType, size]
              properties:
                type:
                  type: string
                  enum: [id_proof, license_front, license_back, profile_photo]
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, application/pdf]
                size:
                  type: number
                  maximum: 5242880
      responses:
        '200':
          description: Signed upload URL generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  signedUrl: { type: string }
                  filePath: { type: string }
                  token: { type: string }
                  expiresIn: { type: number }
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Upload rate limit exceeded

  /drivers/me/documents:
    post:
      x-status: implemented
      summary: Confirm and register uploaded verification document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, filePath]
              properties:
                type:
                  type: string
                  enum: [id_proof, license_front, license_back, profile_photo]
                filePath:
                  type: string
                documentType:
                  type: string
                  enum: [aadhaar, pan, voter_id, passport]
                maskedReference:
                  type: string
                licenseNumberMasked:
                  type: string
                licenseClasses:
                  type: array
                  items:
                    type: string
                expiryDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Document registered in registry successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileAndChecklist'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /drivers/me/submit-for-review:
    post:
      x-status: implemented
      summary: Submit completed onboarding checklist for compliance review
      description: Validates that all 5 checklist steps are complete and transitions onboarding_status to submitted.
      responses:
        '200':
          description: Onboarding checklist submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileAndChecklist'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /drivers/me/availability:
    put:
      x-status: implemented
      summary: Toggle driver online/offline availability
      description: >
        Allows an approved driver to go online or offline.
        Going online requires a recent location update (recorded within the last 10 minutes).
        Drivers cannot go offline while on an active trip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAvailabilityRequest'
      responses:
        '200':
          description: Availability status successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityStatus'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Cannot go offline during an active trip or missing recent location

  /drivers/me/location:
    post:
      x-status: implemented
      summary: Ingest single GPS location breadcrumb
      description: >
        Ingests real-time GPS telemetry (lat, lng, heading, speed, accuracy, recordedAt).
        Validates coordinate ranges, rejects stale (>10 min) or future (>1 min) timestamps,
        discards low accuracy points (>100m) or impossible speeds (>200 km/h).
        Rate-limited to 1 request per second per driver. Upserts into driver_locations and,
        if driver is on an active trip, appends to trip_locations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationPingRequest'
      responses:
        '200':
          description: Location received and ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  recordedAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Telemetry rate limit exceeded

  /drivers/me/location/batch:
    post:
      x-status: implemented
      summary: Ingest batch GPS location breadcrumbs
      description: Ingests an offline buffer batch of up to 20 location points recorded during connectivity loss.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationBatchRequest'
      responses:
        '200':
          description: Batch locations processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  processed: { type: integer, example: 5 }
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Telemetry rate limit exceeded

  /assignments:
    get:
      x-status: implemented
      summary: List incoming trip assignment offers and history
      description: Returns the driver's current active offer (if any) and a paginated history of past assignments.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Active offer and assignment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /assignments/{id}/route:
    get:
      x-status: implemented
      summary: Preview route polyline and ETA for an active offer
      description: Returns pickup/destination coordinates, addresses, distance, duration, and encoded route polyline without exposing customer private contact information.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Route preview details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentRouteResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Assignment offer not found

  /assignments/{id}/accept:
    post:
      x-status: implemented
      summary: Atomically accept a trip assignment offer
      description: >
        Accepts an assignment offer using row-level locks. Validates offer is unexpired and offered,
        the booking is in searching status, and driver is online without active trips.
        Transitions assignment to accepted, booking to driver_assigned, creates a trip record,
        and sets driver status to on_trip. If two drivers race, exactly one succeeds; the second receives 409 Conflict.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assignment accepted, trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentAcceptResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /assignments/{id}/reject:
    post:
      x-status: implemented
      summary: Reject a trip assignment offer
      description: Declines an offered assignment with an optional reason, marking the assignment rejected and enabling the matching engine to dispatch to the next nearest driver.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: distance_too_far
      responses:
        '200':
          description: Assignment rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  assignmentId: { type: string, format: uuid }
                  status: { type: string, example: rejected }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /trips/{id}:
    get:
      x-status: planned
      summary: Get comprehensive trip details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /trips/{id}/arrived:
    post:
      x-status: planned
      summary: Notify customer that driver has arrived at vehicle location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Arrival state recorded
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /trips/{id}/generate-otp:
    post:
      x-status: planned
      summary: Generate a verification OTP for customer vehicle handover
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OTP generated and dispatched to customer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /trips/{id}/verify-otp:
    post:
      x-status: planned
      summary: Verify the start OTP provided by the customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  example: '482910'
      responses:
        '200':
          description: OTP verified successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /trips/{id}/handover:
    post:
      x-status: planned
      summary: Record customer vehicle handover inspection (odometer, fuel, condition)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleHandoverRequest'
      responses:
        '200':
          description: Handover logged
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /trips/{id}/start:
    post:
      x-status: planned
      summary: Mark trip journey started
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip marked in progress
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /trips/{id}/end:
    post:
      x-status: planned
      summary: Mark trip journey completed with final odometer and toll charges
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndTripRequest'
      responses:
        '200':
          description: Trip marked completed and fare settled
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /earnings:
    get:
      x-status: planned
      summary: Get driver payout history and earnings ledger
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
      responses:
        '200':
          description: Driver earnings summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarningsSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /trips/{id}/sos:
    post:
      x-status: planned
      summary: Trigger emergency SOS alert during a trip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SosAlertRequest'
      responses:
        '200':
          description: SOS alert acknowledged and emergency broadcast initiated
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /emergency-contacts:
    get:
      x-status: planned
      summary: Retrieve registered emergency contacts
      responses:
        '200':
          description: List of emergency contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmergencyContact'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
    post:
      x-status: planned
      summary: Register a new emergency contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmergencyContactRequest'
      responses:
        '201':
          description: Emergency contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContact'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /admin/drivers:
    get:
      x-status: implemented
      summary: List drivers by onboarding status (Admin & Support only)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [not_started, in_progress, submitted, under_review, approved, rejected]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of drivers
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Requires admin or support role

  /admin/drivers/{driverId}:
    get:
      x-status: implemented
      summary: Get driver details with short-lived (60s) signed document URLs (Admin only)
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Driver details and 60-second signed document URLs
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Requires admin or support role
        '404':
          description: Driver not found

  /admin/drivers/{driverId}/approve:
    post:
      x-status: implemented
      summary: Approve driver onboarding application
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Driver approved successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Requires admin or support role
        '404':
          description: Driver not found

  /admin/drivers/{driverId}/reject:
    post:
      x-status: implemented
      summary: Reject driver onboarding application with required reason
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
      responses:
        '200':
          description: Driver verification rejected
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Requires admin or support role
        '404':
          description: Driver not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequestError:
      description: Bad request / input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Access forbidden (insufficient permissions or unapproved driver)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Resource state conflict or race condition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplementedError:
      description: Endpoint planned but not implemented in current phase
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
              example: Invalid or expired authorization token
            requestId:
              type: string
              example: a8b38df9-4df1-4a2b-8a8b-18a7c29be191
            details:
              type: object

    HealthResponse:
      type: object
      required:
        - status
        - uptime
        - version
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: number
          example: 124.58
        version:
          type: string
          example: 0.1.0
        timestamp:
          type: string
          format: date-time

    AuthMeResponse:
      type: object
      required:
        - id
        - role
      properties:
        id:
          type: string
          format: uuid
          example: 21fa1e97-15d7-463e-b83c-1b7e6fbe6c4f
        role:
          type: string
          example: driver
        email:
          type: string
          format: email
          example: driver@ryde.in
        phone:
          type: string
          example: '+919876543210'
        full_name:
          type: string
          example: 'Ramesh Kumar'
        account_status:
          type: string
          example: 'active'
        driver:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            driver_code:
              type: string
              example: 'DRV-1001'
            verification_status:
              type: string
              enum: [pending, approved, rejected, expired]
              example: 'approved'
            availability_status:
              type: string
              enum: [offline, online, on_trip]
              example: 'online'
            allowed_vehicle_types:
              type: array
              items:
                type: string
                enum: [two_wheeler, three_wheeler, four_wheeler]
            rating_avg:
              type: number
              example: 4.90
            rating_count:
              type: integer
              example: 42

    CompleteSignupRequest:
      type: object
      properties:
        full_name:
          type: string
          example: 'Ramesh Kumar'
        phone:
          type: string
          example: '+919876543210'
        allowed_vehicle_types:
          type: array
          items:
            type: string
            enum: [two_wheeler, three_wheeler, four_wheeler]
        role:
          type: string
          description: Client-supplied role is strictly ignored by server (always set to driver)
          example: 'admin'

    CompleteSignupResponse:
      type: object
      required:
        - profile
        - driver
      properties:
        profile:
          type: object
        driver:
          type: object

    DriverProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        verificationStatus:
          type: string
          enum: [unverified, pending, verified, rejected, suspended]
        vehicleTypes:
          type: array
          items:
            type: string
            enum: [two_wheeler, three_wheeler, four_wheeler]

    DriverProfileAndChecklist:
      type: object
      required:
        - driver
        - profile
        - onboarding
      properties:
        driver:
          type: object
        profile:
          type: object
        onboarding:
          type: object
          properties:
            status:
              type: string
              enum: [not_started, in_progress, submitted, under_review, approved, rejected]
            rejectionReason:
              type: string
              nullable: true
            submittedAt:
              type: string
              format: date-time
              nullable: true
            progressPercentage:
              type: integer
              example: 100
            completedStepsCount:
              type: integer
              example: 5
            totalStepsCount:
              type: integer
              example: 5
            canSubmit:
              type: boolean
            steps:
              type: object
              properties:
                personalDetails:
                  type: object
                vehicleTypes:
                  type: object
                idProof:
                  type: object
                license:
                  type: object
                selfie:
                  type: object

    UpdateDriverProfileRequest:
      type: object
      properties:
        fullName:
          type: string
        emergencyPhone:
          type: string

    UploadDocumentRequest:
      type: object
      required:
        - documentType
        - documentNumber
        - documentUrl
      properties:
        documentType:
          type: string
          enum: [driving_license, aadhaar, pan, police_verification]
        documentNumber:
          type: string
        documentUrl:
          type: string
          format: uri

    DocumentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentType:
          type: string
        status:
          type: string
          enum: [pending, verified, rejected]

    SetAvailabilityRequest:
      type: object
      required:
        - isAvailable
      properties:
        isAvailable:
          type: boolean
        reason:
          type: string

    AvailabilityStatus:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        isOnline:
          type: boolean
        status:
          type: string
          enum: [offline, available, on_trip, suspended]
        updatedAt:
          type: string
          format: date-time

    LocationBreadcrumb:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 12.9716
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 77.5946
        heading:
          type: number
          nullable: true
          minimum: 0
          maximum: 360
          example: 180.5
        speed:
          type: number
          nullable: true
          minimum: 0
          maximum: 200
          example: 25.2
        accuracy:
          type: number
          nullable: true
          maximum: 100
          example: 15.0
        recordedAt:
          type: string
          format: date-time

    LocationPingRequest:
      $ref: '#/components/schemas/LocationBreadcrumb'

    LocationBatchRequest:
      type: object
      required:
        - locations
      properties:
        locations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/LocationBreadcrumb'

    AssignmentOffer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        assignmentStatus:
          type: string
          enum: [offered, accepted, rejected, expired, cancelled]
        pickupAddress:
          type: string
        destinationAddress:
          type: string
        vehicleType:
          type: string
        estimatedFare:
          type: number
        distanceToPickupKm:
          type: number
        etaToPickupMinutes:
          type: integer
        offeredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    AssignmentsListResponse:
      type: object
      properties:
        activeOffer:
          $ref: '#/components/schemas/AssignmentOffer'
          nullable: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentOffer'
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }

    AssignmentRouteResponse:
      type: object
      properties:
        polyline:
          type: string
          description: Google encoded polyline string
        distanceMeters:
          type: number
        durationSeconds:
          type: number
        pickupAddress:
          type: string
        destinationAddress:
          type: string
        pickupCoords:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }
        destinationCoords:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }

    AssignmentAcceptResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        assignmentId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        status:
          type: string
          example: accepted

    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            [dispatched, arrived_at_pickup, vehicle_handover_pending, started, completed, cancelled]
        pickupLocation:
          type: object
        destinationLocation:
          type: object

    VehicleHandoverRequest:
      type: object
      required:
        - odometerReading
        - checklistPassed
      properties:
        odometerReading:
          type: number
        fuelLevel:
          type: string
          enum: [low, quarter, half, three_quarters, full]
        checklistPassed:
          type: boolean
        notes:
          type: string

    EndTripRequest:
      type: object
      required:
        - odometerReading
      properties:
        odometerReading:
          type: number
        tollAmount:
          type: number
        parkingAmount:
          type: number

    EarningsSummary:
      type: object
      properties:
        driverId:
          type: string
        totalEarnings:
          type: number
        tripsCompleted:
          type: integer
        currency:
          type: string
          example: INR

    SosAlertRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
        longitude:
          type: number
        reason:
          type: string

    EmergencyContact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        relationship:
          type: string
        phone:
          type: string
        isPrimary:
          type: boolean

    CreateEmergencyContactRequest:
      type: object
      required:
        - name
        - relationship
        - phone
      properties:
        name:
          type: string
        relationship:
          type: string
        phone:
          type: string
        isPrimary:
          type: boolean
