openapi: 3.0.3
info:
  title: Ryde Capital API (Driver App Backend)
  version: 0.1.0
  description: >
    REST API specification for Ryde Capital, the driver-facing application of the Ryde Platform.
    Ryde allows vehicle owners in India to book professional drivers for their personal vehicles.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
  - url: https://capital-api.ryde.in/api/v1
    description: Production gateway

security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service operational status, uptime, and current API version.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      x-status: implemented
      summary: Retrieve authenticated driver profile identity
      description: Validates Supabase JWT and returns authenticated user profile plus driver record.
      responses:
        '200':
          description: Successfully authenticated driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/complete-signup:
    post:
      x-status: implemented
      summary: Complete driver profile signup after phone OTP verification
      description: >
        Requires valid Supabase JWT. Upserts profiles (role=driver), creates drivers record,
        sets app_metadata.role=driver, and writes an audit log. The driver role is server-enforced
        and any client-supplied role is strictly ignored. Idempotent across multiple invocations.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSignupRequest'
      responses:
        '200':
          description: Signup completed successfully or existing driver returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteSignupResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Too many requests

  /drivers/me:
    get:
      x-status: implemented
      summary: Get driver personal details, profile & onboarding checklist
      description: Returns the driver profile, verification status, allowed vehicle types, and full 5-step onboarding checklist.
      responses:
        '200':
          description: Driver profile details and onboarding checklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileAndChecklist'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      x-status: implemented
      summary: Update driver personal details and vehicle capabilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileAndChecklist'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /drivers/me/documents/upload-url:
    post:
      x-status: implemented
      summary: Request short-lived signed upload URL for document storage
      description: Returns a short-lived (15 min) signed upload URL to directly upload private KYC documents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, contentType, size]
              properties:
                type:
                  type: string
                  enum: [id_proof, license_front, license_back, profile_photo]
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, application/pdf]
                size:
                  type: number
                  maximum: 5242880
      responses:
        '200':
          description: Signed upload URL generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  signedUrl: { type: string }
                  filePath: { type: string }
                  token: { type: string }
                  expiresIn: { type: number }
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Upload rate limit exceeded

  /drivers/me/documents:
    post:
      x-status: implemented
      summary: Confirm and register uploaded verification document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, filePath]
              properties:
                type:
                  type: string
                  enum: [id_proof, license_front, license_back, profile_photo]
                filePath:
                  type: string
                documentType:
                  type: string
                  enum: [aadhaar, pan, voter_id, passport]
                maskedReference:
                  type: string
                licenseNumberMasked:
                  type: string
                licenseClasses:
                  type: array
                  items:
                    type: string
                expiryDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Document registered in registry successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileAndChecklist'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /drivers/me/submit-for-review:
    post:
      x-status: implemented
      summary: Submit completed onboarding checklist for compliance review
      description: Validates that all 5 checklist steps are complete and transitions onboarding_status to submitted.
      responses:
        '200':
          description: Onboarding checklist submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileAndChecklist'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /drivers/me/availability:
    put:
      x-status: implemented
      summary: Toggle driver online/offline availability
      description: >
        Allows an approved driver to go online or offline.
        Going online requires a recent location update (recorded within the last 10 minutes).
        Drivers cannot go offline while on an active trip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAvailabilityRequest'
      responses:
        '200':
          description: Availability status successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityStatus'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Cannot go offline during an active trip or missing recent location

  /drivers/me/location:
    post:
      x-status: implemented
      summary: Ingest single GPS location breadcrumb
      description: >
        Ingests real-time GPS telemetry (lat, lng, heading, speed, accuracy, recordedAt).
        Validates coordinate ranges, rejects stale (>10 min) or future (>1 min) timestamps,
        discards low accuracy points (>100m) or impossible speeds (>200 km/h).
        Rate-limited to 1 request per second per driver. Upserts into driver_locations and,
        if driver is on an active trip, appends to trip_locations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationPingRequest'
      responses:
        '200':
          description: Location received and ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  recordedAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Telemetry rate limit exceeded

  /drivers/me/location/batch:
    post:
      x-status: implemented
      summary: Ingest batch GPS location breadcrumbs
      description: Ingests an offline buffer batch of up to 20 location points recorded during connectivity loss.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationBatchRequest'
      responses:
        '200':
          description: Batch locations processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  processed: { type: integer, example: 5 }
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Telemetry rate limit exceeded

  /assignments:
    get:
      x-status: implemented
      summary: List incoming trip assignment offers and history
      description: Returns the driver's current active offer (if any) and a paginated history of past assignments.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Active offer and assignment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /assignments/{id}/route:
    get:
      x-status: implemented
      summary: Preview route polyline and ETA for an active offer
      description: Returns pickup/destination coordinates, addresses, distance, duration, and encoded route polyline without exposing customer private contact information.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Route preview details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentRouteResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Assignment offer not found

  /assignments/{id}/accept:
    post:
      x-status: implemented
      summary: Atomically accept a trip assignment offer
      description: >
        Accepts an assignment offer using row-level locks. Validates offer is unexpired and offered,
        the booking is in searching status, and driver is online without active trips.
        Transitions assignment to accepted, booking to driver_assigned, creates a trip record,
        and sets driver status to on_trip. If two drivers race, exactly one succeeds; the second receives 409 Conflict.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assignment accepted, trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentAcceptResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /assignments/{id}/reject:
    post:
      x-status: implemented
      summary: Reject a trip assignment offer
      description: Declines an offered assignment with an optional reason, marking the assignment rejected and enabling the matching engine to dispatch to the next nearest driver.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: distance_too_far
      responses:
        '200':
          description: Assignment rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  assignmentId: { type: string, format: uuid }
                  status: { type: string, example: rejected }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /trips:
    get:
      x-status: implemented
      summary: Retrieve authenticated driver trip history (paginated)
      description: Returns a paginated list of trips assigned to this driver with status filtering.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated trip records
          content:
            application/json:
              schema:
                type: object
                properties:
                  trips:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trip'
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /trips/{id}:
    get:
      x-status: implemented
      summary: Get comprehensive trip details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /trips/{id}/start-heading:
    post:
      x-status: implemented
      summary: Mark driver heading to customer pickup location
      description: Transitions trip state from assigned to heading_to_pickup. Accepts Idempotency-Key.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Driver is now heading to pickup
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /trips/{id}/arrived:
    post:
      x-status: implemented
      summary: Notify customer that driver has arrived at pickup location
      description: Verifies driver is within 150m server geofence, transitions state to arrived, and starts waiting timer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Arrival state recorded and waiting timer initiated
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /trips/{id}/generate-otp:
    post:
      x-status: implemented
      summary: Generate a verification OTP for customer vehicle handover
      description: Generates a 6-digit OTP, stores SHA-256 hash, and writes raw code to dev outbox with 60s cooldown.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OTP generated and dispatched to customer dev outbox
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: OTP cooldown active

  /trips/{id}/verify-otp:
    post:
      x-status: implemented
      summary: Verify the start OTP provided by the customer
      description: Constant-time comparison of hashed OTP with attempt counting and lockout after 5 failures.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  example: '482910'
      responses:
        '200':
          description: OTP verified successfully; state transitioned to otp_verified
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /trips/{id}/handover:
    post:
      x-status: implemented
      summary: Record customer vehicle handover inspection (odometer, fuel, 6 required photos)
      description: Requires otp_verified state and 6 mandatory inspection photos. Transitions state to handover_done.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleHandoverRequest'
      responses:
        '200':
          description: Handover logged and verified
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /trips/{id}/start:
    post:
      x-status: implemented
      summary: Mark trip journey started
      description: Requires handover_done. Sets started_at and transitions state to in_progress.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Trip marked in progress
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /trips/{id}/end:
    post:
      x-status: implemented
      summary: End trip journey with final return handover, GPS trail fare calculation and mock payment
      description: Evaluates 200m destination geofence (requires earlyDropReason if ended elsewhere), computes fare breakdown, records mock payment, and transitions state to completed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndTripRequest'
      responses:
        '200':
          description: Trip marked completed, fare computed, and payment charged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  fare:
                    $ref: '#/components/schemas/FareBreakdown'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /trips/{id}/cancel:
    post:
      x-status: implemented
      summary: Cancel trip prior to start
      description: Driver cancellation with required reason before trip starts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTripRequest'
      responses:
        '200':
          description: Trip cancelled successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /trips/{id}/route:
    get:
      x-status: implemented
      summary: Get cached Google Directions route polyline, distance and ETA
      description: Server-side Google Directions proxy with caching.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Route polyline and estimates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      polyline: { type: string }
                      distanceMeters: { type: number }
                      durationSeconds: { type: number }
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /trips/{id}/contact:
    get:
      x-status: implemented
      summary: Get customer contact phone number
      description: Returns customer phone number only for active trips assigned to this driver.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer contact phone
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      phone: { type: string }
                      customerName: { type: string }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Contact information forbidden for inactive trips

  /earnings/summary:
    get:
      x-status: implemented
      summary: Get driver earnings summary totals
      description: Returns aggregated earnings for today, this week, and this month, plus total completed trips count.
      responses:
        '200':
          description: Earnings summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarningsSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /earnings:
    get:
      x-status: implemented
      summary: Get paginated driver earnings list and per-trip breakdown
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: period
          in: query
          schema:
            type: string
            enum: [today, week, month, all]
            default: all
      responses:
        '200':
          description: Paginated earnings breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarningsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /earnings/payout-accounts:
    get:
      x-status: implemented
      summary: List driver payout accounts
      responses:
        '200':
          description: List of linked payout accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccountsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      x-status: implemented
      summary: Add and verify a new payout account (UPI ID or Bank Account with IFSC)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayoutAccountRequest'
      responses:
        '201':
          description: Payout account verified and created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccountResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /earnings/payout-accounts/{id}/default:
    patch:
      x-status: implemented
      summary: Set payout account as default
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Default account updated
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /earnings/payout-accounts/{id}:
    delete:
      x-status: implemented
      summary: Remove a payout account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account removed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /trips/{id}/rating:
    post:
      x-status: implemented
      summary: Driver rates customer after completed trip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRatingRequest'
      responses:
        '201':
          description: Rating recorded
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Trip has already been rated

  /complaints:
    post:
      x-status: implemented
      summary: File a complaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComplaintRequest'
      responses:
        '201':
          description: Complaint filed
    get:
      x-status: implemented
      summary: List own complaints
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Complaints list

  /notifications:
    get:
      x-status: implemented
      summary: List in-app notifications and unread count
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Notifications list

  /notifications/{id}/read:
    patch:
      x-status: implemented
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked as read

  /notifications/read-all:
    post:
      x-status: implemented
      summary: Mark all unread notifications as read
      responses:
        '200':
          description: All marked as read

  /notifications/device-token:
    post:
      x-status: implemented
      summary: Register device push token (Expo Push)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceTokenRequest'
      responses:
        '201':
          description: Device token registered

  /trips/{id}/sos:
    post:
      x-status: implemented
      summary: Trigger emergency SOS alert during a trip
      description: >
        Creates SOS event with reverse geocoding, alerts emergency contacts via SMS,
        alerts support queue, and dedupes repeated presses within 60 seconds.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SosAlertRequest'
      responses:
        '200':
          description: SOS alert already active (deduped)
        '201':
          description: SOS alert dispatched to emergency contacts and support

  /sos/{id}/cancel:
    post:
      x-status: implemented
      summary: Cancel false alarm SOS event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: SOS event marked cancelled

  /trips/{id}/share:
    post:
      x-status: implemented
      summary: Create time-limited live trip share token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Share token created

  /public/track/{token}:
    get:
      x-status: implemented
      summary: Unauthenticated minimal live trip tracking data
      description: >
        Returns only minimal, unidentifiable information (driver first name, vehicle type,
        live coordinates, destination, ETA). Zero sensitive details. Link dies when trip ends.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Minimal live tracking data
        '404':
          description: Token expired, invalid, or trip concluded

  /public/track/{token}/view:
    get:
      x-status: implemented
      summary: Minimal HTML live tracking view
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HTML page

  /emergency-contacts:
    get:
      x-status: implemented
      summary: Retrieve driver emergency contacts (max 5)
      responses:
        '200':
          description: List of emergency contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmergencyContact'
    post:
      x-status: implemented
      summary: Register a new emergency contact (max 5)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmergencyContactRequest'
      responses:
        '201':
          description: Emergency contact created
        '400':
          $ref: '#/components/responses/BadRequestError'

  /emergency-contacts/{id}:
    patch:
      x-status: implemented
      summary: Update emergency contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated
    delete:
      x-status: implemented
      summary: Delete emergency contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted

  /admin/sos:
    get:
      x-status: implemented
      summary: List open SOS alerts for admin & support
      responses:
        '200':
          description: Open SOS alerts list

  /admin/sos/{id}/acknowledge:
    post:
      x-status: implemented
      summary: Acknowledge SOS event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Acknowledged

  /admin/sos/{id}/resolve:
    post:
      x-status: implemented
      summary: Resolve SOS event with notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resolved


  /admin/drivers:
    get:
      x-status: implemented
      summary: List drivers by onboarding status (Admin & Support only)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [not_started, in_progress, submitted, under_review, approved, rejected]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of drivers
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Requires admin or support role

  /admin/drivers/{driverId}:
    get:
      x-status: implemented
      summary: Get driver details with short-lived (60s) signed document URLs (Admin only)
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Driver details and 60-second signed document URLs
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Requires admin or support role
        '404':
          description: Driver not found

  /admin/drivers/{driverId}/approve:
    post:
      x-status: implemented
      summary: Approve driver onboarding application
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Driver approved successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Requires admin or support role
        '404':
          description: Driver not found

  /admin/drivers/{driverId}/reject:
    post:
      x-status: implemented
      summary: Reject driver onboarding application with required reason
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
      responses:
        '200':
          description: Driver verification rejected
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Requires admin or support role
        '404':
          description: Driver not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequestError:
      description: Bad request / input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Access forbidden (insufficient permissions or unapproved driver)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Resource state conflict or race condition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplementedError:
      description: Endpoint planned but not implemented in current phase
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
              example: Invalid or expired authorization token
            requestId:
              type: string
              example: a8b38df9-4df1-4a2b-8a8b-18a7c29be191
            details:
              type: object

    HealthResponse:
      type: object
      required:
        - status
        - uptime
        - version
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: number
          example: 124.58
        version:
          type: string
          example: 0.1.0
        timestamp:
          type: string
          format: date-time

    AuthMeResponse:
      type: object
      required:
        - id
        - role
      properties:
        id:
          type: string
          format: uuid
          example: 21fa1e97-15d7-463e-b83c-1b7e6fbe6c4f
        role:
          type: string
          example: driver
        email:
          type: string
          format: email
          example: driver@ryde.in
        phone:
          type: string
          example: '+919876543210'
        full_name:
          type: string
          example: 'Ramesh Kumar'
        account_status:
          type: string
          example: 'active'
        driver:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            driver_code:
              type: string
              example: 'DRV-1001'
            verification_status:
              type: string
              enum: [pending, approved, rejected, expired]
              example: 'approved'
            availability_status:
              type: string
              enum: [offline, online, on_trip]
              example: 'online'
            allowed_vehicle_types:
              type: array
              items:
                type: string
                enum: [two_wheeler, three_wheeler, four_wheeler]
            rating_avg:
              type: number
              example: 4.90
            rating_count:
              type: integer
              example: 42

    CompleteSignupRequest:
      type: object
      properties:
        full_name:
          type: string
          example: 'Ramesh Kumar'
        phone:
          type: string
          example: '+919876543210'
        allowed_vehicle_types:
          type: array
          items:
            type: string
            enum: [two_wheeler, three_wheeler, four_wheeler]
        role:
          type: string
          description: Client-supplied role is strictly ignored by server (always set to driver)
          example: 'admin'

    CompleteSignupResponse:
      type: object
      required:
        - profile
        - driver
      properties:
        profile:
          type: object
        driver:
          type: object

    DriverProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        verificationStatus:
          type: string
          enum: [unverified, pending, verified, rejected, suspended]
        vehicleTypes:
          type: array
          items:
            type: string
            enum: [two_wheeler, three_wheeler, four_wheeler]

    DriverProfileAndChecklist:
      type: object
      required:
        - driver
        - profile
        - onboarding
      properties:
        driver:
          type: object
        profile:
          type: object
        onboarding:
          type: object
          properties:
            status:
              type: string
              enum: [not_started, in_progress, submitted, under_review, approved, rejected]
            rejectionReason:
              type: string
              nullable: true
            submittedAt:
              type: string
              format: date-time
              nullable: true
            progressPercentage:
              type: integer
              example: 100
            completedStepsCount:
              type: integer
              example: 5
            totalStepsCount:
              type: integer
              example: 5
            canSubmit:
              type: boolean
            steps:
              type: object
              properties:
                personalDetails:
                  type: object
                vehicleTypes:
                  type: object
                idProof:
                  type: object
                license:
                  type: object
                selfie:
                  type: object

    UpdateDriverProfileRequest:
      type: object
      properties:
        fullName:
          type: string
        emergencyPhone:
          type: string

    UploadDocumentRequest:
      type: object
      required:
        - documentType
        - documentNumber
        - documentUrl
      properties:
        documentType:
          type: string
          enum: [driving_license, aadhaar, pan, police_verification]
        documentNumber:
          type: string
        documentUrl:
          type: string
          format: uri

    DocumentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentType:
          type: string
        status:
          type: string
          enum: [pending, verified, rejected]

    SetAvailabilityRequest:
      type: object
      required:
        - isAvailable
      properties:
        isAvailable:
          type: boolean
        reason:
          type: string

    AvailabilityStatus:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        isOnline:
          type: boolean
        status:
          type: string
          enum: [offline, available, on_trip, suspended]
        updatedAt:
          type: string
          format: date-time

    LocationBreadcrumb:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 12.9716
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 77.5946
        heading:
          type: number
          nullable: true
          minimum: 0
          maximum: 360
          example: 180.5
        speed:
          type: number
          nullable: true
          minimum: 0
          maximum: 200
          example: 25.2
        accuracy:
          type: number
          nullable: true
          maximum: 100
          example: 15.0
        recordedAt:
          type: string
          format: date-time

    LocationPingRequest:
      $ref: '#/components/schemas/LocationBreadcrumb'

    LocationBatchRequest:
      type: object
      required:
        - locations
      properties:
        locations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/LocationBreadcrumb'

    AssignmentOffer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        assignmentStatus:
          type: string
          enum: [offered, accepted, rejected, expired, cancelled]
        pickupAddress:
          type: string
        destinationAddress:
          type: string
        vehicleType:
          type: string
        estimatedFare:
          type: number
        distanceToPickupKm:
          type: number
        etaToPickupMinutes:
          type: integer
        offeredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    AssignmentsListResponse:
      type: object
      properties:
        activeOffer:
          $ref: '#/components/schemas/AssignmentOffer'
          nullable: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentOffer'
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }

    AssignmentRouteResponse:
      type: object
      properties:
        polyline:
          type: string
          description: Google encoded polyline string
        distanceMeters:
          type: number
        durationSeconds:
          type: number
        pickupAddress:
          type: string
        destinationAddress:
          type: string
        pickupCoords:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }
        destinationCoords:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }

    AssignmentAcceptResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        assignmentId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        status:
          type: string
          example: accepted

    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trip_status:
          type: string
          enum:
            [assigned, heading_to_pickup, arrived, otp_verified, handover_done, in_progress, completed, cancelled_by_driver, cancelled_by_customer, cancelled_by_system]
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        waiting_started_at:
          type: string
          format: date-time
          nullable: true
        waiting_duration_s:
          type: integer
        distance_km:
          type: number
        duration_minutes:
          type: number
        booking:
          type: object
        vehicle:
          type: object
        customer:
          type: object

    HandoverPhotoItem:
      type: object
      required:
        - photoType
        - filePath
      properties:
        photoType:
          type: string
          enum: [front, back, left, right, odometer, fuel_gauge]
        filePath:
          type: string

    VehicleHandoverRequest:
      type: object
      required:
        - odometerBefore
        - fuelLevelBefore
        - photos
      properties:
        odometerBefore:
          type: number
        fuelLevelBefore:
          type: number
        notes:
          type: string
        existingDamageNotes:
          type: string
        photos:
          type: array
          minItems: 6
          items:
            $ref: '#/components/schemas/HandoverPhotoItem'

    EndTripRequest:
      type: object
      required:
        - odometerAfter
      properties:
        odometerAfter:
          type: number
        fuelLevelAfter:
          type: number
        earlyDropReason:
          type: string
        notes:
          type: string
        returnPhotos:
          type: array
          items:
            $ref: '#/components/schemas/HandoverPhotoItem'

    CancelTripRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3

    FareBreakdown:
      type: object
      properties:
        baseFare:
          type: number
        distanceCharge:
          type: number
        timeCharge:
          type: number
        waitingCharge:
          type: number
        subtotal:
          type: number
        platformFee:
          type: number
        tax:
          type: number
        total:
          type: number

    EarningsSummary:
      type: object
      properties:
        driverId:
          type: string
        totalEarnings:
          type: number
        tripsCompleted:
          type: integer
        currency:
          type: string
          example: INR

    SosAlertRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
        longitude:
          type: number
        reason:
          type: string

    EmergencyContact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        relationship:
          type: string
        phone:
          type: string
        isPrimary:
          type: boolean

    CreateEmergencyContactRequest:
      type: object
      required:
        - name
        - relationship
        - phone
      properties:
        name:
          type: string
        relationship:
          type: string
        phone:
          type: string
        isPrimary:
          type: boolean
